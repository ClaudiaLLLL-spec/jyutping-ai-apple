name: JyutpingAI
options:
  bundleIdPrefix: com.claudialiao
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JyutpingAI-iOS:
    type: application
    platform: iOS
    sources:
      - path: AppleApp/Sources
      - path: AppleApp/Resources
        buildPhase: resources
        excludes: [www]
      - path: AppleApp/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudialiao.jyutpingai
        PRODUCT_NAME: "粤音智标"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "粤音智标"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  JyutpingAI-macOS:
    type: application
    platform: macOS
    sources:
      - path: AppleApp/Sources
      - path: AppleApp/Resources
        buildPhase: resources
        excludes: [www]
      - path: AppleApp/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudialiao.jyutpingai.mac
        PRODUCT_NAME: "粤音智标"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "粤音智标"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
